<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="title desc">
  <title id="title">BornoMala Configuration Architecture</title>
  <desc id="desc">Configuration lifecycle from SettingsDrawer UI through Tauri IPC commands, BornoConfig validation, SemVer schema management, atomic disk persistence, and live BornoEngine reconfiguration.</desc>
  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Self-contained dark-slate canvas -->
  <rect x="0" y="0" width="960" height="520" rx="14" fill="#0f172a"/>
  <rect x="1" y="1" width="958" height="518" rx="13" fill="none" stroke="#334155" stroke-width="1.5"/>
  <rect x="0" y="0" width="960" height="4" rx="2" fill="#38bdf8"/>

  <!-- Header -->
  <text x="32" y="40" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">BornoMala — Configuration, Validation &amp; Persistence Flow</text>
  <text x="32" y="62" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12.5">Atomic persistence, SemVer 2.0.0 schema protection, and live engine synchronization (Schema v1.2.0)</text>

  <!-- Column 1: Settings UI -->
  <g transform="translate(32, 90)">
    <rect width="236" height="304" rx="10" fill="#111827" stroke="#818cf8" stroke-width="1.3"/>
    <rect x="0" y="0" width="236" height="4" rx="2" fill="#818cf8"/>
    <text x="16" y="28" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700">Settings Interface</text>
    <text x="16" y="46" fill="#a5b4fc" font-family="ui-monospace, Consolas, monospace" font-size="10.8">src/components/SettingsDrawer.tsx</text>
    <line x1="16" y1="58" x2="220" y2="58" stroke="#1e293b" stroke-width="1"/>

    <text x="16" y="80" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">UI Tabs &amp; Controls</text>
    <text x="16" y="100" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5">• Typing &amp; Dictionary limits</text>
    <text x="16" y="118" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5">• Appearance (theme, font size)</text>
    <text x="16" y="136" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5">• Shortcuts &amp; fixed layouts</text>
    <text x="16" y="154" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5">• JSON Backup &amp; Diagnostics</text>

    <line x1="16" y1="170" x2="220" y2="170" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="190" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Tauri IPC Commands</text>
    <rect x="16" y="200" width="204" height="88" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="26" y="218" fill="#38bdf8" font-family="ui-monospace, Consolas, monospace" font-size="11">get_config()</text>
    <text x="26" y="235" fill="#38bdf8" font-family="ui-monospace, Consolas, monospace" font-size="11">save_config(BornoConfig)</text>
    <text x="26" y="252" fill="#38bdf8" font-family="ui-monospace, Consolas, monospace" font-size="11">reset_config_to_defaults()</text>
    <text x="26" y="269" fill="#38bdf8" font-family="ui-monospace, Consolas, monospace" font-size="11">export_config / import_config</text>
  </g>

  <!-- Arrow Col 1 -> Col 2 -->
  <line x1="268" y1="220" x2="318" y2="220" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="293" y="210" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, Consolas, monospace" font-size="10">IPC</text>

  <!-- Column 2: Validation & Transaction Coordinator -->
  <g transform="translate(324, 90)">
    <rect width="302" height="304" rx="10" fill="#111827" stroke="#38bdf8" stroke-width="1.3"/>
    <rect x="0" y="0" width="302" height="4" rx="2" fill="#38bdf8"/>
    <text x="16" y="28" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="700">Validation &amp; Transaction Layer</text>
    <text x="16" y="46" fill="#38bdf8" font-family="ui-monospace, Consolas, monospace" font-size="10.8">src-tauri/src/lib.rs • AppState</text>
    <line x1="16" y1="58" x2="286" y2="58" stroke="#1e293b" stroke-width="1"/>

    <!-- Step 1 -->
    <rect x="16" y="70" width="270" height="58" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="26" y="90" fill="#fbbf24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">1. Guards &amp; Semantic Validation</text>
    <text x="26" y="108" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11">config_mutex + session_degraded check</text>
    <text x="26" y="122" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace" font-size="10.2">BornoConfig::validate() (limits, schema 1.2.0)</text>

    <!-- Step 2 -->
    <rect x="16" y="140" width="270" height="58" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="26" y="160" fill="#34d399" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">2. Atomic Disk Persistence</text>
    <text x="26" y="178" fill="#cbd5e1" font-family="ui-monospace, Consolas, monospace" font-size="10.5">config_store::save_config_safe()</text>
    <text x="26" y="192" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace" font-size="10.2">execute_reset_transaction() on reset</text>

    <!-- Step 3 -->
    <rect x="16" y="210" width="270" height="78" rx="7" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="26" y="230" fill="#38bdf8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">3. Live Engine Reconfiguration</text>
    <text x="26" y="248" fill="#cbd5e1" font-family="ui-monospace, Consolas, monospace" font-size="10.5">engine.configure(&amp;config)</text>
    <text x="26" y="264" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11">Preserves active mode &amp; preedit composition;</text>
    <text x="26" y="279" fill="#fbbf24" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="10.5">post-commit lock failure marks session_degraded</text>
  </g>

  <!-- Arrows Col 2 -> Col 3 -->
  <line x1="626" y1="168" x2="672" y2="168" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>
  <line x1="626" y1="305" x2="672" y2="305" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)"/>

  <!-- Column 3 Top: Schema Management -->
  <g transform="translate(678, 90)">
    <rect width="250" height="146" rx="10" fill="#111827" stroke="#f59e0b" stroke-width="1.3"/>
    <rect x="0" y="0" width="250" height="4" rx="2" fill="#f59e0b"/>
    <text x="16" y="28" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Schema &amp; Path Safety</text>
    <text x="16" y="46" fill="#fbbf24" font-family="ui-monospace, Consolas, monospace" font-size="10.5">src-tauri/src/config_store.rs</text>
    <line x1="16" y1="56" x2="234" y2="56" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="75" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5">• SemVer 2.0.0: 1.2.0 (current)</text>
    <text x="16" y="93" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5">• Migrates 1.0.0 / 1.1.0 safely</text>
    <text x="16" y="111" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5">• Future schema → Read-only lock</text>
    <text x="16" y="129" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5">• Symlink rejection (inspect_path)</text>
  </g>

  <!-- Column 3 Bottom: Persistent Storage -->
  <g transform="translate(678, 252)">
    <rect width="250" height="142" rx="10" fill="#111827" stroke="#10b981" stroke-width="1.3"/>
    <rect x="0" y="0" width="250" height="4" rx="2" fill="#10b981"/>
    <text x="16" y="28" fill="#f8fafc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Persistent Storage</text>
    <text x="16" y="46" fill="#34d399" font-family="ui-monospace, Consolas, monospace" font-size="10.5">app_config_dir()/config.json</text>
    <line x1="16" y1="56" x2="234" y2="56" stroke="#1e293b" stroke-width="1"/>
    <text x="16" y="75" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5">• Temp write + atomic replace</text>
    <text x="16" y="93" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5">• Preserves .bak_unsupported.&lt;ts&gt;</text>
    <text x="16" y="111" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.5">• PersistenceStatus tracking</text>
    <text x="16" y="129" fill="#94a3b8" font-family="ui-monospace, Consolas, monospace" font-size="10.2">Active | LockedUnsupported | ReadOnly</text>
  </g>

  <!-- Bottom Runtime Application Target Strip -->
  <g transform="translate(32, 414)">
    <rect width="896" height="84" rx="10" fill="#111827" stroke="#334155" stroke-width="1.2"/>
    <text x="20" y="24" fill="#38bdf8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Startup vs. Live Reconfiguration &amp; UI/Adapter Scope</text>
    <text x="20" y="43" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.2">• Startup (BornoEngine::with_config): sets initial default_startup_mode &amp; preferred_fixed_layout.</text>
    <text x="20" y="60" fill="#cbd5e1" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.2">• Live (BornoEngine::configure): preserves current mode &amp; composition; updates candidate limits (1..9), dictionary toggles &amp; auto-dari.</text>
    <text x="20" y="77" fill="#94a3b8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11.2">• UI / Adapters: apply active_theme, candidate_orientation, candidate_font_size &amp; mode_toggle_key (F12 / F4) shortcuts.</text>
  </g>

  <!-- Vertical connector from Validation Layer to Runtime Engine -->
  <line x1="475" y1="394" x2="475" y2="412" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-cyan)"/>
</svg>
