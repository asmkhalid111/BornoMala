[package]
name = "bornomala-core"
version = "0.1.0"
edition = "2021"
description = "Core input engine and language logic for BornoMala Bangla Input Platform"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"

[dev-dependencies]
